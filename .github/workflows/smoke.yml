name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  import-test:
    name: package imports + tool count
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimum runtime deps
        # Just enough that `import hearth` succeeds. Voice/STT deps are
        # optional and lazy-imported.
        run: |
          python -m pip install --upgrade pip
          pip install openai psutil

      - name: Import hearth package
        run: |
          python -c "import hearth; print('tools:', len(hearth.TOOL_DEFINITIONS)); print('prompt chars:', len(hearth.system_prompt()))"

      - name: Smoke-test the dev_tools REPL listing
        run: |
          python -c "from hearth.dev_tools import cmd_list; cmd_list()"

      - name: Tool call parsing
        # Every case here cost real work when it broke: a call cut one brace
        # short, an unclosed tag swallowing the next call, file content that
        # contains the closing tag.
        run: |
          python tests/test_tool_call_parsing.py

      - name: Tool contract
        # `import hearth` succeeds even when a tool is unusable, so check that
        # every advertised tool resolves to a handler, that no method has been
        # orphaned out of its class, and that a missing field is refused rather
        # than raised.
        run: |
          python tests/test_tool_contract.py

      - name: Batched desktop steps
        # A batch drives the real mouse and keyboard, so check that it refuses a
        # tool outside the desktop set and stops at the first failing step
        # instead of typing the rest of the sequence into whatever is in front.
        run: |
          python tests/test_desktop_batch.py

      - name: Engine picker and repair plan
        # Build tags sort as numbers, not strings, or the picker runs a stale
        # engine and the pruner deletes the current one. And the repair plan
        # keeps a separate list from the patch builder, so check they agree.
        run: |
          python tests/test_install_contract.py

      - name: Voice settings reach every surface
        # The voice panes save to settings.json and the voice modules read env
        # vars, with nothing binding the two, so a setting can be written and
        # displayed as selected while applying to one surface only.
        run: |
          python tests/test_voice_settings.py

      - name: Destructive command guard
        # PowerShell gives every cmdlet a short alias and a .NET equivalent, so
        # a guard that matches only long names catches one spelling in nineteen.
        # The second half matters as much: a guard that refuses ordinary work
        # gets routed around, and then it guards nothing.
        run: |
          python tests/test_destructive_guard.py

      - name: The model cannot approve its own call
        # Tool arguments are a dict the model fills in, and the tool layer reads
        # one key out of that same dict as control. A truthiness test let the
        # model clear the destructive guard by adding one key.
        run: |
          python tests/test_approval_boundary.py

      - name: A reply where some calls read and one does not
        # The branch that ran when anything parsed did not check for LEFTOVER
        # markup, so a reply with twenty calls and one bracket typo ran the
        # nineteen and dropped the twentieth without a word.
        run: |
          python tests/test_partial_tool_parse.py

      - name: Another website cannot use the local API
        # A page on any site that fetches 127.0.0.1 sends Host 127.0.0.1, so a
        # loopback host check alone let it through, and wildcard CORS let it
        # read stored keys back and call tools.
        run: |
          python tests/test_api_origin.py

      - name: Resuming a download, and reporting a load
        # A part file at or past the end of the file makes every resume answer
        # 416, so the download fails the same way forever with no way to clear
        # it. And the engine prints its metadata before it reads a tensor, so a
        # bar driven by log position jumps up and then holds still for the wait.
        run: |
          python tests/test_download_progress.py

      - name: Workspace containment is by folder, not by prefix
        run: |
          python tests/test_containment.py

      - name: Working out when a reminder is for
        # Most ordinary phrasings parsed as nothing, so the reminder was
        # refused. And "tonight at 11" was accepted and set for eleven in the
        # morning without saying anything.
        run: |
          python tests/test_reminder_parsing.py

      - name: Finding a tool that isn't loaded by default
        # The matcher scored a query token against a description with a plain
        # substring test, so a short word landed inside a longer one and a
        # query that matched nothing came back with unrelated tools under
        # "you can call them now".
        run: |
          python tests/test_tool_discovery.py

      - name: Saving a conversation
        # A kill between the write and the rename leaves the temporary behind,
        # and it ends in .json, so the lister read it as a second copy of the
        # chat it was about to become.
        run: |
          python tests/test_convo_store.py

      - name: An update cut off partway through
        # The rollback inside the applier only runs for a failure it lives to
        # see. A power cut or a kill during the extract left two versions mixed
        # together, with nothing to notice it and no way back.
        run: |
          python tests/test_patch_recovery.py

      - name: The window's script
        # One file, no import to fail: a stray bracket takes the whole
        # interface down to a blank page and nothing would have caught it.
        # Also flags a control wired to an id no markup defines, which does
        # not break, it just silently never works.
        run: |
          python tests/test_ui_script.py

      - name: Verify all tool dispatchers exist
        run: |
          python -c "from hearth.tools import TOOL_DEFINITIONS, _HANDLERS; missing = [td['name'] for td in TOOL_DEFINITIONS if td['name'] not in _HANDLERS]; assert not missing, f'tools missing a dispatcher in _HANDLERS: {missing}'; print('ok,', len(TOOL_DEFINITIONS), 'tools dispatch')"

  persona-stable:
    name: persona prompt renders cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install openai psutil
      - name: Render persona
        run: |
          python -c "from hearth.persona import system_prompt; p = system_prompt(); assert 4000 < len(p) < 60000, f'persona suspicious size: {len(p)}'; print('persona ok,', len(p), 'chars')"
