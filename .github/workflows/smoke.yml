name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  import-test:
    name: package imports + tool count
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimum runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install openai psutil

      - name: Import hearth package
        run: |
          python -c "import hearth; print('tools:', len(hearth.TOOL_DEFINITIONS)); print('prompt chars:', len(hearth.system_prompt()))"

      - name: Smoke-test the dev_tools REPL listing
        run: |
          python -c "from hearth.dev_tools import cmd_list; cmd_list()"

      - name: Tool call parsing
        run: |
          python tests/test_tool_call_parsing.py

      - name: Tool contract
        run: |
          python tests/test_tool_contract.py

      - name: A click lands on the control under the point
        run: |
          python tests/test_click_snap.py

      - name: Batched desktop steps
        run: |
          python tests/test_desktop_batch.py

      - name: Engine picker and repair plan
        run: |
          python tests/test_install_contract.py

      - name: Voice settings reach every surface
        run: |
          python tests/test_voice_settings.py

      - name: Destructive command guard
        run: |
          python tests/test_destructive_guard.py

      - name: The model cannot approve its own call
        run: |
          python tests/test_approval_boundary.py

      - name: A reply where some calls read and one does not
        run: |
          python tests/test_partial_tool_parse.py

      - name: Another website cannot use the local API
        run: |
          python tests/test_api_origin.py

      - name: Pausing or cancelling a model download
        run: |
          python tests/test_download_cancel.py

      - name: Resuming a download, and reporting a load
        run: |
          python tests/test_download_progress.py

      - name: Workspace containment is by folder, not by prefix
        run: |
          python tests/test_containment.py

      - name: The terminal, run as a real process
        if: runner.os == 'Windows'
        run: |
          python tests/test_cli.py

      - name: The persona the model reads every turn
        run: |
          python tests/test_persona.py

      - name: A real turn through the terminal's agent loop
        if: runner.os == 'Windows'
        run: |
          python tests/test_cli_turn.py

      - name: Broadcasts reaching the people they are written for
        run: |
          python tests/test_announcements.py

      - name: The memory store and its index
        run: |
          python tests/test_memory_store.py

      - name: Chat apps share pairing, the conversation and questions before risky steps
        run: |
          python tests/test_channel_core.py
          python tests/test_telegram_bridge.py
          python tests/test_discord_bridge.py
          python tests/test_custom_connector.py

      - name: Who the WhatsApp bridge answers
        run: |
          python tests/test_whatsapp_gate.py

      - name: A bridge started from the window keeps running
        run: |
          python tests/test_bridge_spawn.py

      - name: The reminders file the window and the terminal share
        run: |
          python tests/test_reminder_store.py

      - name: Other builds of llama.cpp for models the official build can't read
        run: |
          python tests/test_added_engines.py

      - name: The Logs page says which calls failed and what came back
        run: |
          python tests/test_activity_log.py

      - name: An agent brain reaches all of Inglen's tools
        run: |
          python tests/test_brain_mcp_tools.py

      - name: What a GGUF file is, from its header
        run: |
          python tests/test_gguf_shape.py

      - name: A model's details for the model menu, from its own source first
        run: |
          python tests/test_model_facts.py

      - name: A team of agents, as the panes show it
        run: |
          python tests/test_team.py
          python tests/test_helper_loop_guard.py
          python tests/test_helper_changes.py
          python tests/test_helper_worktree.py
          python tests/test_helper_messages.py
          python tests/test_acp_brain.py
          python tests/test_bridge_follow.py
          python tests/test_cli_team.py
          python tests/test_chat_sync.py
          python tests/test_codex_helper.py
          python tests/test_cursor_accent.py

      - name: Voice sessions end cleanly and stay apart
        run: |
          python tests/test_voice_session.py

      - name: Which microphone voice opens
        run: |
          python tests/test_mic_choice.py

      - name: Saving a setting leaves the speech engine loaded
        run: |
          python tests/test_settings_save.py

      - name: The wake word hears whole phrases and yields the mic
        run: |
          python tests/test_wake.py

      - name: Commands report their real output and exit status
        run: |
          python tests/test_run_command.py

      - name: The terminal follows a brain change without inventing a model
        run: |
          python tests/test_cli_brain_sync.py

      - name: The terminal knows whether the model can see
        run: |
          python tests/test_vision_check.py

      - name: The terminal shrinks a prompt that overflows instead of resending it
        run: |
          python tests/test_cli_overflow.py

      - name: A long paste in the terminal shows as a marker and is sent whole
        run: |
          python tests/test_cli_paste.py
          python tests/test_cli_commands.py
          python tests/test_team_sprites.py
          python tests/test_chat_call.py

      - name: A cloud provider's models are read from the provider
        run: |
          python tests/test_provider_models.py

      - name: A search pattern cannot become a ripgrep option
        run: |
          python tests/test_grep_search.py

      - name: Writes stay in the workspace, links included
        run: |
          python tests/test_write_containment.py

      - name: The window opens without loading every chat
        run: |
          python tests/test_convo_loading.py

      - name: Settings are read under HEARTH_ names, old JARVIS_ ones too
        run: |
          python tests/test_env_names.py

      - name: Model downloads run without the window and resume after a restart
        run: |
          python tests/test_model_downloads.py

      - name: A model load that crashes does not wedge the next one
        run: |
          python tests/test_model_start_failure.py

      - name: The Team view reports what each helper is really doing
        run: |
          python tests/test_team_state.py

      - name: Graphics card readings without NVIDIA's tool
        run: |
          python tests/test_gpu.py
          python tests/test_gpu_platforms.py

      - name: The engine download for each system and card
        run: |
          python tests/test_engine_platforms.py

      - name: Apps, files, links and away time on Linux and macOS
        run: |
          python tests/test_platform_standins.py

      - name: The local image engine loads a model it can run, and the tools use it
        run: |
          python tests/test_sdserver.py

      - name: A turn that uses the desktop shows it and gives the screen back
        run: |
          python tests/test_desktop_session.py

      - name: First-run answers reach the model, from the window and the terminal
        run: |
          python tests/test_onboarding.py

      - name: Starting a helper from the Team view
        run: |
          python tests/test_team_start.py

      - name: Pinned chats stay pinned
        run: |
          python tests/test_convo_pins.py

      - name: Claude Code as the assistant's brain
        run: |
          python tests/test_claude_brain.py

      - name: Codex as the assistant's brain
        run: |
          python tests/test_codex_brain.py

      - name: Cursor as the assistant's brain
        run: |
          python tests/test_cursor_brain.py

      - name: A working helper can be told something
        run: |
          python tests/test_tell_subagent.py

      - name: What a cloud provider's refusal turns into
        run: |
          python tests/test_api_errors.py

      - name: Other agent CLIs run as Team members
        run: |
          python tests/test_external_agents.py

      - name: Ask, Auto-edit and Auto decide the same way everywhere
        run: |
          python tests/test_approval_modes.py

      - name: Every slash command is listed, and every listed one exists
        run: |
          python tests/test_slash_commands.py

      - name: A helper model runs next to the main one
        run: |
          python tests/test_helper_model.py

      - name: The voice visuals move when you talk
        run: |
          python tests/test_voice_levels.py

      - name: On headphones, words said right after Inglen speaks are sent
        run: |
          python tests/test_voice_dropping.py

      - name: The window starts without a script error, in the look that was saved
        if: runner.os == 'Windows'
        run: |
          python tests/test_ui_boot.py
          python tests/test_ui_chat.py
          python tests/test_ui_model_menu.py
          python tests/test_ui_images.py
          python tests/test_ui_connectors.py

      - name: The public tool reference matches the code
        if: matrix.os == 'windows-latest'
        run: |
          python scripts/gen_tools_doc.py
          git diff --exit-code -- docs/TOOLS.md

      - name: Masking secrets out of public output
        run: |
          python tests/test_redaction.py

      - name: Working out when a reminder is for
        run: |
          python tests/test_reminder_parsing.py

      - name: Finding a tool that isn't loaded by default
        run: |
          python tests/test_tool_discovery.py

      - name: Saving a conversation
        run: |
          python tests/test_convo_store.py

      - name: An update cut off partway through
        run: |
          python tests/test_patch_recovery.py

      - name: The window's script
        run: |
          python tests/test_ui_script.py

      - name: Verify all tool dispatchers exist
        run: |
          python -c "from hearth.tools import TOOL_DEFINITIONS, _HANDLERS; missing = [td['name'] for td in TOOL_DEFINITIONS if td['name'] not in _HANDLERS]; assert not missing, f'tools missing a dispatcher in _HANDLERS: {missing}'; print('ok,', len(TOOL_DEFINITIONS), 'tools dispatch')"

  persona-stable:
    name: persona prompt renders cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install openai psutil
      - name: Render persona
        run: |
          python -c "from hearth.persona import system_prompt; p = system_prompt(); assert 4000 < len(p) < 20000, f'persona suspicious size: {len(p)}'; print('persona ok,', len(p), 'chars')"
